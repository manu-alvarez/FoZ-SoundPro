<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="FoZ SoundPro">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131c2e"/>
      <stop offset="0.55" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f2fe"/>
      <stop offset="1" stop-color="#fe0369"/>
    </linearGradient>
    <radialGradient id="glowGrad" cx="0.5" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#00f2fe" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fondo premium oscuro -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" fill="url(#glowGrad)"/>
  <rect x="7" y="7" width="498" height="498" rx="106" fill="none" stroke="url(#neonGrad)" stroke-opacity="0.45" stroke-width="3"/>

  <!-- Barras de espectro laterales (metáfora EQ) -->
  <g stroke="url(#neonGrad)" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="88"  y1="212" x2="88"  y2="164"/>
    <line x1="120" y1="226" x2="120" y2="150"/>
    <line x1="152" y1="204" x2="152" y2="176"/>
    <line x1="360" y1="204" x2="360" y2="170"/>
    <line x1="392" y1="226" x2="392" y2="150"/>
    <line x1="424" y1="212" x2="424" y2="164"/>
  </g>

  <!-- Puerto de control (metáfora mixer/knob) -->
  <circle cx="256" cy="186" r="86" fill="#070a13" stroke="url(#neonGrad)" stroke-width="9"/>
  <circle cx="256" cy="186" r="60" fill="#0c1220" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <path d="M 256 118 A 68 68 0 0 1 324 186" fill="none" stroke="url(#neonGrad)" stroke-width="11" stroke-linecap="round"/>
  <line x1="256" y1="186" x2="256" y2="138" stroke="#ffffff" stroke-opacity="0.9" stroke-width="7" stroke-linecap="round"/>
  <circle cx="256" cy="186" r="9" fill="#00f2fe"/>

  <!-- Logotipo -->
  <text x="256" y="386" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="128" font-weight="900" fill="url(#neonGrad)" letter-spacing="4">FoZ</text>
  <text x="256" y="436" text-anchor="middle"
        font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="27" font-weight="700" fill="#9fb3d1" letter-spacing="16">SOUNDPRO</text>
</svg>
